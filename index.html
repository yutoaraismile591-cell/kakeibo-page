<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょう</h2>
  </header>

  <main>
    <section class="entry-section" aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿記録の登録</h2>
      <form>
        <p>
          <label for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input id="entry-item" name="item" type="text" required>
        </p>
        <p>
          <label for="entry-type">収支</label>
          <select id="entry-type" name="type" required>
            <option value="expense">費用</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input id="entry-amount" name="amount" type="number" min="1" step="1" required>
        </p>
        <button type="submit">登録</button>
      </form>
    </section>

    <section class="summary-section" aria-labelledby="summary-heading">
      <h2 id="summary-heading">差引残高</h2>
      <p>収入 − 支出：<output aria-label="差引残高">0</output>円</p>
    </section>

    <section class="list-section" aria-labelledby="list-heading">
      <h2 id="list-heading">登録したデータ</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">収支</th>
            <th scope="col">金額（円）</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">登録データはありません。</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
